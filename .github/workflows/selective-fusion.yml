name: Selective Fusion Regression

on:
  push:
    branches:
      - main
      - feat/selective-risk-aware-joint-fusion
  pull_request:

jobs:
  selective-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small selective-fusion test dependencies
        run: python -m pip install numpy scipy trimesh
      - name: Check Python syntax for all fusion and regression modules
        run: python -m compileall -q fusion_pipeline tests/test_selective_fusion.py
      - name: Run isolated selective fusion regressions
        run: python -m unittest discover -s tests -p 'test_selective_fusion.py' -v
