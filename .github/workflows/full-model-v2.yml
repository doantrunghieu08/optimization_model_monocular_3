name: Full Model v2 unit checks

on:
  pull_request:
    paths:
      - "fusion_pipeline/**"
      - "tests/**"
      - "configs/pipeline.yml"
      - "ablation_runner.py"
      - ".github/workflows/full-model-v2.yml"

jobs:
  model-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python modules
        run: python -m compileall -q fusion_pipeline tests ablation_runner.py
      - name: Install minimal unit test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.13.1" "torch==2.5.1" "opencv-python-headless==4.10.0.84" PyYAML ruamel.yaml joblib tqdm pytest trimesh rtree
      - name: Run adaptive model unit tests (no WHAM/GT dataset required)
        run: |
          python -m pytest -q tests/test_adaptive_protection.py tests/test_bone_risk_gate.py tests/test_full_model_v2.py
