runtime:
  stage: evaluation
  clean_output: true
  skip_unsynchronized_cameras: true
preprocess:
  offset_estimation:
    max_frames: null
pose_export:
  enabled: true
  use_world_coords: false
inputs:
  cam1_pkl: input/Hugging/exo/cam04/harmony4D_002_hugging_cam04_wham/wham_harmony4D_002_hugging_cam04_ffmpeg.pkl
  cam2_pkl: input/Hugging/exo/cam05/harmony4D_002_hugging_cam05_wham/wham_harmony4D_002_hugging_cam05_ffmpeg.pkl
  camera1_video: input/Hugging/exo/cam04/images/harmony4D_002_hugging_cam04_ffmpeg.mp4
  camera2_video: input/Hugging/exo/cam05/images/harmony4D_002_hugging_cam05_ffmpeg.mp4
  ground_truth_dir: input/Hugging/processed_data/poses3d
  target_person: aria02
  person_heights:
    aria01: 1.737
    aria02: 1.7
paths:
  smpl_model: models/SMPL_NEUTRAL.pkl
  segmentation: models/smpl_partSegmentation_mapping.pkl
  keypoints3d_map: configs/keypoints3D_map.yml
  keypoints2d_map: configs/keypoints2D_map.yml
  j_regressor_3d: models/J_regressor_body25_extended.npy
  preprocess_output_dir: output/preprocess_results
  pose_output_dir: output/pose_results
  fused_output_dir: output/fused_results
  learnable_output_dir: output/learnable_results
  learnable_extra_output_dir: output/learnable_extra_results
  visualization_output_dir: output/visualize_results
  evaluation_output_dir: output/evaluation_results
fusion:
  enabled: true
  aotr:
    enabled: true
    missing_2d_mode: 3d_surrogate
    three_d_consensus_weight: 0.12
    three_d_slave_advantage_gain: 3.0
    three_d_master_prior_weight: 0.5
    three_d_temporal_weight: 0.15
    three_d_jitter_epsilon: 0.06
    three_d_occluded_master_reliability: 0.15
    sequence_stability:
      enabled: true
      temporal_stability:
        enabled: true
        shape_weight: 2.5
        residual_accel_weight: 1.0
        residual_velocity_weight: 0.5
        minimum_retention: 0.8
        smooth_trajectories: true
        smooth_window: 7
        max_iter: 160
      anatomical_calibration:
        enabled: true
    min_2d_confidence: 0.35
    min_correspondences: 4
    alignment_median_max_m: 0.12
    alignment_q75_max_m: 0.18
    ransac_threshold_m: 0.06
    ransac_max_combos: 100
    min_bone_direction_cos: -0.8
    observability_ratio: 0.1
    observed_prior_weight: 0.0001
    unobserved_prior_weight: 0.003
    huber_delta_normalized: 0.008
    minimum_cost_reduction: 1.0e-07
    trust_max_iter: 12
    trust_initial_radius: 0.25
  selective_joint_fusion:
    enabled: false
    quality_margin_visible: 0.1
    quality_margin_occluded: 0.06
    max_displacement_visible: 0.12
    max_displacement_occluded: 0.35
    max_bone_relative_error: 0.15
    minimum_slave_2d_support: 0.15
    minimum_slave_belief: 0.1
    alignment_median_max_m: 0.08
    alignment_q75_max_m: 0.12
    blend_strength: 0.35
    optimize_selected: false
  belief:
    alpha: 0.001
    beta: 0.8
  occlusion:
    enabled: true
    tau: 0.05
  uncertainty_gating:
    consensus_blend_strength: 0.5
    enabled: true
    max_displacement: 0.35
    min_confidence: 0.1
    consensus_threshold: 0.08
  master_protection:
    enabled: true
    confidence_margin: 0.15
    default_mode: aggressive
    pair_modes:
      cam13->cam20: posed_fallback
      cam17->cam20: posed_fallback
      cam19->cam20: posed_fallback
  angle_limits:
    enabled: true
    min_angle_deg: 30.0
    max_angle_deg: 175.0
  smoothing:
    enabled: true
    window_length: 5
    polyorder: 2
  ransac:
    threshold: 0.05
    max_combos: 500
  optimization:
    enabled: true
    regularization: true
    regularization_lambda: 1.0
    temporal_lambda: 2.0
    max_iter: 35
learnable:
  enabled: false
  checkpoint: models/best_ckpt.pth.tar
learnable_extra:
  enabled: false
visualization:
  enabled: false
  target_fps: 10
  dpi: 100
  max_frames: null
  cameras:
  - camera1
  - camera2
evaluation:
  enabled: true
  testcase_name: null
  metrics:
    pa_mpjpe: true
    mpjpe: true
    pck: false
    pck_threshold_mm: 150.0
    mble: true
    accel: true
