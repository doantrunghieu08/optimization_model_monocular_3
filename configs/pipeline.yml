runtime:
  # Chế độ chạy hiện tại của pipeline.
  # - visualization: chạy full chuỗi preprocess -> evaluation -> visualization.
  # - evaluation: chỉ kiểm tra và chạy evaluation trên output đã có sẵn.
  stage: visualization
  clean_output: true # xóa file output cũ trước khi ghi mới.

preprocess:
  offset_estimation:
    max_frames: null # Số frame tối đa dùng cho ước lượng offset.

inputs:
  cam1_pkl: "input/Seq1/imageSequence/Segments/video_0_seg_1/video_0_seg_1.pkl"
  cam2_pkl: "input/Seq1/imageSequence/Segments/video_2_seg_1/video_2_seg_1.pkl"
  camera1_video: "input/Seq1/imageSequence/video_0.avi"
  camera2_video: "input/Seq1/imageSequence/video_2.avi"
  ground_truth_dir: "input/Seq1/GT" # Thư mục ground-truth cho evaluation.

paths:
  smpl_model: "models/SMPL_NEUTRAL.pkl"
  keypoints3d_map: "configs/keypoints3D_map.yml"
  keypoints2d_map: "configs/keypoints2D_map.yml"
  j_regressor_3d: "models/J_regressor_body25_extended.npy"

  preprocess_output_dir: "output/preprocess_results"
  pose_output_dir: "output/pose_results"
  fused_output_dir: "output/fused_results"
  learnable_output_dir: "output/learnable_results"
  learnable_extra_output_dir: "output/learnable_extra_results"
  visualization_output_dir: "output/visualize_results"
  evaluation_output_dir: "output/evaluation_results"

fusion:
  enabled: true
  method: proposed # proposed, aligned_averaging, hoặc higher_belief_selection.
  shared_body_pose_enabled: false # Fusion local SMPL rotations; không cần camera calibration.
  max_fallback_ratio: 0.0 # Fail nếu có bất kỳ frame nào không fusion được.
  belief:
    alpha: ${ALPHA:-0.001} # alpha: hệ số phạt theo khoảng cách 3D của joint, càng lớn thì joint xa camera càng bị giảm tin cậy mạnh hơn.
    beta: ${BETA:-0.8} # beta: hệ số trộn tin cậy của láng giềng xương trong harmonic mean, càng lớn thì belief càng chịu ảnh hưởng bởi skeleton lân cận.
    global: ${GLOBAL:-true} # true: hòa belief của joint với các joint xương lân cận.
    local_method: ${LOCAL_METHOD:-"optical_aware_belief"} # naive_distance_belief hoặc optical_aware_belief.

  occlusion:
    enabled: true # Ray-casting trên mesh torso trong hệ tọa độ camera.
    tau: 0.02 # Khoảng cách an toàn (m) giữa giao điểm mesh và joint.

  # Cấu hình RANSAC dùng để ước lượng similarity transform giữa 2 camera.
  ransac:
    threshold: 0.05 # Ngưỡng sai khác để coi một joint là inlier.
    max_combos: 500 # Số tổ hợp mẫu tối đa khi không thể liệt kê toàn bộ triplet.

  # Cấu hình tối ưu hóa cho nhóm điểm F trong fusion.
  correction:
    enabled: true # Enabled soft confidence blending & sequence root alignment
    orientation_enabled: false # Disabled after the 20-pair ablation showed regression.
    reject_new_mismatches: true
    confidence_delta_cap: 0.05 # Giảm ngưỡng delta cap xuống 0.05 để giải phóng tập điểm F cho SLSQP tối ưu hóa
    blend_mode: confidence # Trộn theo belief liên tục thay vì hard replace
    alignment_mode: sequence_root # Tự ước lượng scale/rotation từ cả sequence, không cần camera calibration.
    selector: limb_winner # Thay cả chuỗi tay/chân khi một camera tin cậy hơn; giữ confidence/occlusion để A/B.
    max_bone_angle_deg: 25.0 # Bỏ qua chain nếu hướng xương đổi > 25° (giới hạn biến dạng hình dạng PA).

  optimization:
    enabled: true # Enabled kinematic & temporal SLSQP optimizer
    use_kinematic_constraints: ${KINEMATIC_CONSTRAINTS:-true}
    loss_type: ${LOSS_TYPE:-"huber"} # huber hoặc mse.
    regularization: true
    regularization_lambda: 2.0 # Hệ số phạt của proximity regularization.
    temporal_lambda: 2.0 # Hệ số phạt theo thời gian so với frame trước.
    accel_lambda: 3.0 # Hệ số phạt gia tốc 2nd-order giữa 3 frame liên tiếp.
    max_iter: 1000 # Số vòng lặp tối đa cho bộ giải SLSQP.

learnable:
  enabled: false
  checkpoint: "models/best_ckpt.pth.tar"

learnable_extra:
  enabled: true

visualization:
  enabled: false
  target_fps: 10 # FPS của video render.
  dpi: 100 # DPI của figure matplotlib.
  max_frames: null # Giới hạn số frame render, null nghĩa là render hết frame có thể ghép.
  # Danh sách camera cần render.
  cameras:
    - camera1
    - camera2

evaluation:
  enabled: true
  testcase_name: null #đánh giá testcase hay dataset
  metrics:
    pa_mpjpe: true # PA-MPJPE là metric mặc định đang bật.
    mpjpe: true
    pck: false
    pck_threshold_mm: 150.0
    mble: true
    accel: true
