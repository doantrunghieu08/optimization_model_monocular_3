runtime:
  # Chế độ chạy hiện tại của pipeline.
  # - visualization: chạy full chuỗi preprocess -> evaluation -> visualization.
  # - evaluation: chỉ kiểm tra và chạy evaluation trên output đã có sẵn.
  stage: visualization
  clean_output: true # xóa file output cũ trước khi ghi mới.

preprocess:
  offset_estimation:
    max_frames: null # Số frame tối đa dùng cho ước lượng offset.

pose_export:
  enabled: true
  use_world_coords: false # Giữ false (camera coords) để ray-casting khớp với WHAM mesh vertices

inputs:
  cam1_pkl: "input/Hugging/exo/cam04/harmony4D_002_hugging_cam04_wham/wham_harmony4D_002_hugging_cam04_ffmpeg.pkl"
  cam2_pkl: "input/Hugging/exo/cam05/harmony4D_002_hugging_cam05_wham/wham_harmony4D_002_hugging_cam05_ffmpeg.pkl"
  camera1_video: "input/Hugging/exo/cam04/images/harmony4D_002_hugging_cam04_ffmpeg.mp4"
  camera2_video: "input/Hugging/exo/cam05/images/harmony4D_002_hugging_cam05_ffmpeg.mp4"
  ground_truth_dir: "input/Hugging/processed_data/smpl" # Thư mục ground-truth cho evaluation.
  target_person: "aria01" # Chọn 1 người để fusion ("aria01" hoặc "aria02")

paths:
  smpl_model: "models/SMPL_NEUTRAL.pkl"
  segmentation: "models/smpl_partSegmentation_mapping.pkl"
  keypoints3d_map: "configs/keypoints3D_map.yml"
  keypoints2d_map: "configs/keypoints2D_map.yml"
  j_regressor_3d: "models/J_regressor_body25_extended.npy"

  preprocess_output_dir: "output/preprocess_results"
  pose_output_dir: "output/pose_results"
  fused_output_dir: "output/fused_results"
  learnable_output_dir: "output/learnable_results"
  learnable_extra_output_dir: "output/learnable_extra_results"
  visualization_output_dir: "output/visualize_results"
  evaluation_output_dir: "output/evaluation_results"

fusion:
  enabled: true
  belief:
    alpha: ${ALPHA:-0.001} # alpha: hệ số phạt theo khoảng cách 3D (0.001 để phân biệt nhẹ góc nhìn gần/xa)
    beta: ${BETA:-0.8} # beta: hệ số trộn tin cậy của láng giềng xương trong harmonic mean, càng lớn thì belief càng chịu ảnh hưởng bởi skeleton lân cận.

  occlusion:
    enabled: true  # Phát hiện che khuất bằng 3D ray-casting
    tau: 0.05 # Ngưỡng khoảng cách (m) trước joint để kết luận joint bị che khuất.

  # Cơ chế Uncertainty-Gating: ngăn chặn việc thay thế khớp nếu camera phụ không đáng tin cậy
  uncertainty_gating:
    consensus_blend_strength: 0.50
    enabled: true
    max_displacement: 0.35 # Khoảng cách tối đa (m) giữa tọa độ ánh xạ và mục tiêu
    min_confidence: 0.1    # Ngưỡng tin cậy tối thiểu của camera phụ
    consensus_threshold: 0.08 # Ngưỡng (m) đồng thuận đa góc nhìn để blend các khớp cùng nhìn thấy rõ

  # Chỉ cho camera phụ sửa joint đang nhìn rõ khi belief cao hơn đủ lớn.
  master_protection:
    enabled: true
    confidence_margin: 0.15
    default_mode: aggressive
    pair_modes:
      "cam13->cam21": posed_fallback

  # Cơ chế giới hạn góc giải phẫu: kiểm soát góc uốn khớp bản lề (khuỷu tay, đầu gối)
  angle_limits:
    enabled: true
    min_angle_deg: 30.0   # Tránh gập ép quá mức
    max_angle_deg: 175.0  # Tránh gập ngược / hyperextension

  # Bộ lọc làm mượt quỹ đạo thời gian (giảm rung giật / giảm Accel Error)
  smoothing:
    enabled: true
    window_length: 5
    polyorder: 2

  # Cấu hình RANSAC dùng để ước lượng similarity transform giữa 2 camera.
  ransac:
    threshold: 0.05 # Ngưỡng sai khác để coi một joint là inlier.
    max_combos: 500 # Số tổ hợp mẫu tối đa khi không thể liệt kê toàn bộ triplet.

  # Cấu hình tối ưu hóa nhóm điểm F bằng PyTorch GPU Autograd + Adam (thay thế SLSQP CPU)
  optimization:
    enabled: true
    regularization: true
    regularization_lambda: 1.0 # Hệ số phạt của proximity regularization.
    temporal_lambda: 2.0 # Hệ số phạt theo thời gian so với frame trước.
    max_iter: 35 # Số vòng lặp tối đa cho PyTorch GPU Adam.

learnable:
  enabled: false
  checkpoint: "models/best_ckpt.pth.tar"

learnable_extra:
  enabled: true

visualization:
  enabled: false
  target_fps: 10 # FPS của video render.
  dpi: 100 # DPI của figure matplotlib.
  max_frames: null # Giới hạn số frame render, null nghĩa là render hết frame có thể ghép.
  # Danh sách camera cần render.
  cameras:
    - camera1
    - camera2

evaluation:
  enabled: true
  testcase_name: null #đánh giá testcase hay dataset
  metrics:
    pa_mpjpe: true # PA-MPJPE là metric mặc định đang bật.
    mpjpe: true
    pck: false
    pck_threshold_mm: 150.0
    mble: true
    accel: true
