fusion:
  enabled: true
  # Phương pháp dung hợp (tất cả đều cần aotr.enabled=true):
  # - aotr    : trust-region lấy Master làm gốc (mặc định).
  # - partwise: trộn đối xứng hướng xương, căn Slave theo từng phần thân (hông/vai),
  #             trọng số theo độ sâu, giữ chiều dài xương Master. Xem MODEL_CHANGES.md.
  # - naive   : BASELINE so sánh. Mỗi frame: căn Slave vào Master bằng một phép xoay Kabsch
  #             (tâm hông), rồi lấy trung bình vị trí khớp. Không học.
  # - adaptive_naive: ĐỐI CHỨNG cho AOTR. Cùng phép căn RANSAC thân, cùng ngưỡng và cùng bước
  #             làm mượt với AOTR (lấy từ fusion.aotr), nhưng thay bộ tối ưu bằng trọng số đóng
  #             cho từng xương: q = c^p * exp(-j/tau), w_Slave = q_S / (q_M + q_S),
  #             u = normalize((1-w) u_M + w R21 u_S), dựng lại bằng FK với chiều dài xương Master.
  #             c = confidence 2D của xương (min hai đầu mút có keypoint 2D trực tiếp);
  #             j = độ rung hướng xương (sai phân bậc hai, trung bình ±h frame) / trung vị của xương đó.
  #             Không dùng GT. Chỉ p và tau là tham số tự do: fit trên split train rồi đóng băng.
  method: aotr
  naive:
    # Trọng số Master cố định; 0.5 = trung bình thuần. Không được tinh chỉnh (là baseline).
    master_weight: 0.5
    # true: qua cùng bước làm mượt của AOTR (fusion.aotr.sequence_stability: savgol + FK theo
    # chiều dài xương Master), để so sánh không lẫn lợi ích làm mượt. false = baseline thô cũ.
    use_aotr_stability: true
  adaptive_naive:
    confidence_power: 1.0     # p; 0 = bỏ confidence 2D
    jitter_scale: 1.0         # tau, đơn vị trung vị độ rung; rất lớn = bỏ độ rung
    jitter_half_window: 3     # h (frame)
    missing_confidence: 0.5   # c khi xương/frame không có điểm 2D
  partwise:
    # Tham số logistic học MỘT LẦN trên split design (aria01, cam02/04/13/19) và đóng băng.
    # w_Master = sigmoid(a + b * ((depth_M - depth_S) - mu) / sd), depth = z của tâm hông (m).
    depth_logit:
      a: -1.2388837544067565e-05
      b: 1.6761106970863668
      mu: 4.2041772210435745e-05
      sd: 1.3685969107519123
    rotation_half_window: 4
    multi_person:
      enabled: true
      visibility_weighted_rotation: true
      master_occluded_logit_bias: 2.0
      slave_occluded_logit_bias: 2.5
      both_occluded_logit_bias: 0.5
      anti_swap_gate: true
      max_median_bone_angle_deg: 50.0
      static_camera_orientation: false
      orientation_smooth_half_window: 2
    sequence_stability:
      enabled: true
      temporal_stability:
        enabled: true
        shape_weight: 2.5
        residual_accel_weight: 1.0
        residual_velocity_weight: 0.5
        minimum_retention: 0.8
        smooth_trajectories: true
        smooth_window: 7
        max_iter: 160
      anatomical_calibration:
        enabled: false
  aotr:
    enabled: true
    missing_2d_mode: 3d_surrogate
    three_d_consensus_weight: 0.12
    three_d_slave_advantage_gain: 3.0
    three_d_master_prior_weight: 0.5
    three_d_temporal_weight: 0.15
    three_d_jitter_epsilon: 0.06
    three_d_occluded_master_reliability: 0.15
    sequence_stability:
      enabled: true
      temporal_stability:
        enabled: true
        shape_weight: 2.5
        residual_accel_weight: 1.0
        residual_velocity_weight: 0.5
        minimum_retention: 0.8
        smooth_trajectories: true
        smooth_window: 7
        max_iter: 160
      # Khóa chiều dài xương = Master (baseline) từng frame. Bật lại sẽ scale chi theo
      # chiều cao ước lượng (sai ~12%) -> MBLE Hugging 22 -> 41 mm.
      anatomical_calibration:
        enabled: false
    min_2d_confidence: 0.35
    min_correspondences: 4
    alignment_median_max_m: 0.12
    alignment_q75_max_m: 0.18
    ransac_threshold_m: 0.06
    ransac_max_combos: 100
    min_bone_direction_cos: -0.8
    observability_ratio: 0.1
    observed_prior_weight: 0.0001
    unobserved_prior_weight: 0.003
    huber_delta_normalized: 0.008
    minimum_cost_reduction: 1.0e-07
    trust_max_iter: 12
    trust_initial_radius: 0.25
    temporal_alignment_fallback: true
    max_cross_view_bone_angle_deg: 50.0
  selective_joint_fusion:
    enabled: false
    quality_margin_visible: 0.1
    quality_margin_occluded: 0.06
    max_displacement_visible: 0.12
    max_displacement_occluded: 0.35
    max_bone_relative_error: 0.15
    minimum_slave_2d_support: 0.15
    minimum_slave_belief: 0.1
    alignment_median_max_m: 0.08
    alignment_q75_max_m: 0.12
    blend_strength: 0.35
    optimize_selected: false
  belief:
    alpha: 0.001
    beta: 0.8
  occlusion:
    enabled: true
    tau: 0.05
    multi_person: true
    inter_person_tau: 0.15
    inter_person_radius_m: 0.045
    inter_person_min_hits: 3
  uncertainty_gating:
    consensus_blend_strength: 0.5
    enabled: true
    max_displacement: 0.35
    min_confidence: 0.1
    consensus_threshold: 0.08
  master_protection:
    enabled: true
    confidence_margin: 0.15
    default_mode: aggressive
    pair_modes:
      cam13->cam20: posed_fallback
      cam17->cam20: posed_fallback
      cam19->cam20: posed_fallback
  angle_limits:
    enabled: true
    min_angle_deg: 30.0
    max_angle_deg: 175.0
  smoothing:
    enabled: true
    window_length: 5
    polyorder: 2
  ransac:
    threshold: 0.05
    max_combos: 500
  optimization:
    enabled: true
    regularization: true
    regularization_lambda: 1.0
    temporal_lambda: 2.0
    max_iter: 35
learnable:
  enabled: false
  checkpoint: models/best_ckpt.pth.tar
learnable_extra:
  enabled: false
visualization:
  enabled: false
  target_fps: 20
  dpi: 100
  max_frames: null
  cameras:
  - camera1
  - camera2
evaluation:
  enabled: true
  testcase_name: null
  # Loại các frame mà track WHAM bám nhầm người (tráo ID) khỏi phần đánh giá.
  # Tạo bằng: python build_identity_mask.py configs/brute_force.yml configs/identity_mask_hugging_002.json
  # Bộ khớp chấm điểm: coco17 (Harmony4D 3D keypoints: 12 khớp thân + mũi/mắt/tai) | priority1 (cũ, 12 khớp)
  joint_set: coco17
  # Căn chỉnh MPJPE: sequence = gốc tâm hông + MỘT phép xoay cố định mỗi camera cho cả chuỗi
  # (thay cho extrinsics khi không có); frame = xoay lại từng frame (cũ, dễ dãi hơn).
  mpjpe_alignment: sequence
  # 043_Grappling2: nhãn người tạo bằng python -m preprocessing_data.label_persons (xem README).
  identity_mask:
    path:
      - configs/identity_mask_hugging_002.json
      - configs/identity_mask_grappling2_043.json
      - configs/identity_mask_005_sword3.json
    margin_mm: 10.0
  metrics:
    pa_mpjpe: true
    mpjpe: true
    pck: false
    pck_threshold_mm: 150.0
    mble: true
    accel: true
